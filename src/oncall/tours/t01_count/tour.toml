id = "count"
technique = "数える"
title = "届かないメールは、どこ宛てか"
commands = ["cut", "sort", "uniq", "grep", "head"]
host = "mail-relay-01"
workdir = "mail"
helps = ["error-ips", "lost-orders"]

intro = """
朝から「メールが届かない」という問い合わせが増えています。
先輩は、メールを送り出すサーバーの送信記録 `mail.log` を開きました。記録は 2,000 行ほどあります。

先輩は、これを上から読みません。**数えます**。
"""

outro = """
長いコマンドは、最初から長かったわけではありません。先輩がしたのは、次の繰り返しです。

1. 短いコマンドを打って、`head` で少しだけ見る
2. 合っていたら、後ろに `|` で 1 つ足す

`sort | uniq -c | sort -rn` は「種類ごとに数えて、多い順に並べる」決まった形です。
変えるのは、その前の「何を数えるか」を取り出す部分だけです。
"""

[[steps]]
say = "まず、記録がどんな形をしているかを見るよ。全部は要らない。最初の 3 行だけ。"
run = "head -3 mail.log"
note = """
1 行が 1 通です。空白で区切ると、6 番目が `status=…`(送れたかどうか)、4 番目が `to=…`(宛先)です。

数える前に、**何番目に何があるか**を確かめる。これが最初の一手です。
"""

[[steps]]
say = "状態だけを見たい。6 番目だけを取り出してみる。合っているかは、5 行だけ見れば分かる。"
run = "cut -d' ' -f6 mail.log | head -5"
note = """
`cut -d' ' -f6` は「空白で区切って(`-d' '`)、6 番目だけ(`-f6`)を出す」です。

後ろの `| head -5` は確認用です。2,000 行を流さずに、取り出し方が合っているかだけを見ています。
"""

[[steps]]
say = "合っているね。じゃあ head を外して、種類ごとに数える。"
run = "cut -d' ' -f6 mail.log | sort | uniq -c"
note = """
`uniq -c` は、**隣り合った**同じ行をまとめて、何行あったかを先頭に付けます。
隣り合っていないとまとまらないので、先に `sort` で同じものを並べておきます。

`sort | uniq -c` は、いつも 2 つ一組で使います。
"""

[[steps]]
say = "種類が増えても読めるように、多い順に並べておくよ。"
run = "cut -d' ' -f6 mail.log | sort | uniq -c | sort -rn"
note = """
2 つ目の `sort` は役目が違います。`-n` は数として比べる、`-r` は大きい順、です。

`status=bounced` は「相手に受け取ってもらえず、戻ってきた」メールです。少なくない数があります。
"""

[[steps]]
say = "次は、戻ってきたメールだけを見る。どこ宛てなんだろう。"
run = "grep status=bounced mail.log | head -3"
note = """
`grep` で、`status=bounced` を含む行だけに絞りました。ここでも、まず `head` で少しだけ見ています。

宛先は 4 番目の `to=名前@ドメイン` です。知りたいのは `@` の後ろ、ドメインです。
"""

[[steps]]
say = "4 番目を取って、さらに @ で区切った 2 つ目を取る。cut を 2 回使えばいい。"
run = "grep status=bounced mail.log | cut -d' ' -f4 | cut -d@ -f2 | head -3"
note = """
1 つ目の `cut` で `to=名前@ドメイン` を取り出し、2 つ目の `cut -d@ -f2` で `@` の後ろだけにしました。

一度に取り出そうとせず、**区切りを変えて 2 回**。1 つずつ確かめながら足しているので、間違えてもすぐ気づけます。
"""

[[steps]]
say = "あとは、さっきと同じ形で数えるだけ。"
run = "grep status=bounced mail.log | cut -d' ' -f4 | cut -d@ -f2 | sort | uniq -c | sort -rn | head -5"
note = """
戻ってきたメールは、`{{bad_domain}}` 宛てに集中しています。こちらの不具合ではなく、相手側で何か起きていそうです。

コマンドは長くなりましたが、中身は「絞る → 取り出す → 取り出す → 数えて並べる」の 4 つです。
"""
