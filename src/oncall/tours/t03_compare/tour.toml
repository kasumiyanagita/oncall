id = "compare"
technique = "比べる"
title = "辞めた人のアカウントは、残っていないか"
commands = ["awk", "cut", "sort", "comm", "wc"]
host = "audit-01"
workdir = "audit"
helps = ["lost-orders"]

intro = """
年に一度の点検です。サーバーに、辞めた人のアカウントが残っていないかを調べます。

手元にあるのは 2 つ。人事からもらった在籍者の名簿 `staff.txt` と、サーバーのアカウントの一覧 `accounts.txt` です。
先輩は、2 つを目で見比べません。**同じ形にそろえてから、道具に比べさせます**。
"""

outro = """
2 つの一覧を比べるときの手順は、いつも同じです。

1. それぞれから、比べたい部分だけを取り出す
2. 同じ順に並べて(`sort`)、ファイルに置く
3. `comm` で「片方だけ」「両方」を出す

難しいのは `comm` ではなく、その前の「同じ形にそろえる」ところです。そろえてしまえば、比べるのは一瞬です。
"""

[[steps]]
say = "まず、2 つがどんな形かを見る。head はファイルをいくつ並べてもいい。"
run = "head -3 staff.txt accounts.txt"
note = """
形が違います。名簿は空白区切りで 1 番目が名前、アカウントの一覧は `:` 区切りで 1 番目が名前です。

このままでは比べられません。どちらも「名前だけが、1 行に 1 つ」の形にそろえます。
"""

[[steps]]
say = "名簿から名前だけを取り出して、並べる。まず画面で確かめるよ。"
run = "awk '{print $1}' staff.txt | sort | head -3"
note = """
`awk '{print $1}'` は「空白で区切った 1 番目を出す」です。空白がいくつ続いていても 1 つの区切りとして扱うので、
桁をそろえた表にはこちらが向いています(`cut` は、空白 1 つずつを区切りとして数えます)。

`sort` を付けたのは、あとで使う `comm` が「並んでいること」を前提にしているからです。
"""

[[steps]]
say = "合っている。head を外して、ファイルに置く。"
run = "awk '{print $1}' staff.txt | sort > staff.names"
note = """
`>` は、画面に出すかわりにファイルへ書きます。だから、画面には何も出ません。

**画面で確かめてから、ファイルへ**。順番を逆にすると、間違ったファイルを作ったことに気づけません。
"""

[[steps]]
say = "アカウントのほうも同じ形にする。こっちは : で区切られているから、cut でいい。"
run = "cut -d: -f1 accounts.txt | sort > account.names"
note = """
`cut -d: -f1` は「`:` で区切った 1 番目」です。区切りの文字がはっきり決まっているときは `cut` が手軽です。

道具は違っても、できあがるものは同じ形です。
"""

[[steps]]
say = "比べる前に、それぞれ何人いるかを見ておく。"
run = "wc -l staff.names account.names"
note = """
`wc -l` は行数を数えます。人数が違うので、どこかに食い違いがあることは、これだけで分かります。

ただし、人数が同じでも中身が同じとは限りません。誰が違うのかは、比べないと分かりません。
"""

[[steps]]
say = "comm で比べる。まず、アカウントにしかいない人。"
run = "comm -13 staff.names account.names"
note = """
`comm` は、結果を 3 つの列に分けます。1: 左のファイルだけ、2: 右のファイルだけ、3: 両方にある。
`-13` は「1 と 3 の列を**消す**」という意味なので、残るのは「右(アカウント)だけにある名前」です。

名簿にいないのに、アカウントが残っています。止める候補です。
"""

[[steps]]
say = "逆も見る。名簿にはいるのに、アカウントがない人。"
run = "comm -23 staff.names account.names"
note = """
数字を 1 つ変えただけです。`-23` は 2 と 3 の列を消すので、「左(名簿)だけにある名前」が残ります。

こちらは、入ったばかりでアカウントがまだ作られていない人でしょう。同じ 2 つのファイルから、別の問いに答えが出ました。
"""

[[steps]]
say = "最後に、どちらにもいる人が何人かを数えて、記録に残す数字をそろえておく。"
run = "comm -12 staff.names account.names | wc -l"
note = """
`-12` で「両方にある名前」だけを残し、`wc -l` で数えました。

「両方」「名簿だけ」「アカウントだけ」。3 つの数字がそろうと、点検の報告が書けます。
"""
