id = "stop"
technique = "止める"
title = "間違えて動かした集計を、1 つだけ止める"
commands = ["ps", "grep", "awk", "tail", "kill"]
host = "batch-01"
workdir = "batch"
helps = ["runaway-worker"]

intro = """
同僚から連絡が来ました。「毎晩の集計を手で動かし直したとき、日付を間違えた。`{{wrong_date}}` の分が動いてしまっている」。

サーバーでは、正しい日付(`{{right_date}}`)の集計も動いています。止めたいのは、間違えたほう **1 つだけ** です。
先輩は、止める前に時間を使います。**相手を確かめてから、番号で止めます**。
"""

outro = """
`kill` そのものは一瞬でした。先輩が時間を使ったのは、その前です。

1. `ps` で、動いているものを見る
2. 記録を見て、どれが止める相手かを確かめる
3. 相手の番号(PID)を、**1 つだけ**取り出す
4. `kill` で止めて、もう一度 `ps` で確かめる

名前でまとめて止める道具もありますが、似た名前の別のものまで止めてしまうことがあります。
番号を見てから止めれば、止まるのは見たものだけです。
"""

[[steps]]
say = "まず、動いているものを全部出して、その中から集計を探す。"
run = "ps aux | grep nightly-report"
note = """
`ps aux` は、動いているプログラム(プロセス)を全部出します。`grep` で、集計の行だけに絞りました。

集計が 2 つ動いています。もう 1 行、`grep nightly-report` 自身も出ています。探している `grep` も、動いているプロセスだからです。
"""

[[steps]]
say = "見たい列だけにする。番号、動いている時間、コマンド。ついでに grep 自身も外すよ。"
run = "ps -eo pid,etime,args | grep '[n]ightly-report'"
note = """
`-eo pid,etime,args` は「全部のプロセスについて、番号(PID)・動いている時間・コマンドの全体だけを出す」です。

`'[n]ightly-report'` は小さな工夫です。`[n]` は「n という 1 文字」なので、探す相手は同じ `nightly-report` です。
けれど、`grep` 自身のコマンドには `[n]ightly-report` と書いてあるので、それには当たりません。
"""

[[steps]]
say = "止める前に、本当に間違えた日付のほうが動いているのか、記録でも確かめる。"
run = "tail -3 logs/report-{{wrong_date}}.log"
note = """
`tail -3` は、ファイルの最後の 3 行を出します。記録は後ろに足されていくので、最後を見れば「いま」が分かります。

時刻が進んでいます。`{{wrong_date}}` の集計は、いまも動き続けています。止める相手は、これで間違いありません。
"""

[[steps]]
say = "相手の番号だけを取り出す。コマンドの最後が、間違えた日付になっている行の、1 番目。"
run = "ps -eo pid,args | grep '[n]ightly-report' | awk '$NF == \"{{wrong_date}}\" {print $1}'"
note = """
`awk` の `$NF` は「その行の最後の項目」です。最後が `{{wrong_date}}` の行だけを選び、1 番目(PID)を出しました。

出てきた番号は 1 つだけです。**2 つ以上出たら、止めずに条件を見直します**。ここが、いちばん大事な確かめです。
"""

[[steps]]
say = "番号が 1 つに決まった。ここで初めて止める。"
run = "kill {{prev}}"
note = """
`kill 番号` は、そのプロセスに「終わってください」と伝えます。うまくいけば何も出ません。

先輩は `-9`(問答無用で止める)を付けませんでした。まずふつうに頼み、それで止まらないときにだけ `-9` を使います。
ふつうの `kill` なら、相手は後片付けをしてから終われます。
"""

[[steps]]
say = "止まったかどうかは、もう一度見るまで分からない。"
run = "ps -eo pid,etime,args | grep '[n]ightly-report'"
note = """
残っているのは、正しい日付(`{{right_date}}`)の集計だけです。動いている時間も続いていて、こちらには触っていないことが分かります。

2 手目と同じコマンドです。止める前と後を、同じ見方で比べました。
"""
