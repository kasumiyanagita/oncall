id = "find"
technique = "探す"
title = "昨夜のバックアップは、取れているか"
commands = ["find", "ls", "grep"]
host = "backup-01"
workdir = "backup"
helps = ["disk-and-keys", "quarantine"]

intro = """
毎晩 2 時に、データベース(db)とファイル(files)のバックアップを `archive/` に取っています。
今朝、先輩は「昨夜の分がちゃんと取れているか」を点検することにしました。

ファイルは日付ごとにたくさんあります。先輩は、`ls` で 1 つずつ見ません。**条件を言って、探させます**。
"""

outro = """
`find` は「どこを」「どんな条件で」探すかを並べて書きます。条件は、後ろにいくつでも足せます。

- 名前で(`-name`)、新しさで(`-mtime`)、大きさで(`-size`)、種類で(`-type`)
- `!` を付けると「そうでないもの」
- `-exec … {} +` で、見つけたものにそのままコマンドを使う

先輩は、条件を 1 つ足すたびに結果を見ていました。いきなり全部の条件を書いたわけではありません。
"""

[[steps]]
say = "まず、バックアップのファイルがどう並んでいるかを見る。名前が .tar.gz で終わるものを探すよ。"
run = "find archive -name '*.tar.gz'"
note = """
`find archive` は「`archive` の下を、奥まで全部」探します。`-name '*.tar.gz'` が条件です。

`'*.tar.gz'` を `'` で囲むのは、`*` をシェルに先に解釈させず、そのまま `find` に渡すためです。
"""

[[steps]]
say = "多いね。昨夜の分だけでいい。条件を 1 つ足すよ。"
run = "find archive -name '*.tar.gz' -mtime -1"
note = """
`-mtime -1` は「最後に書き換えられたのが、1 日(24 時間)以内」です。`-` が「より新しい」、`+` なら「より古い」です。

条件を並べると「どちらも満たすもの」になります。db と files の 2 つが見つかりました。
"""

[[steps]]
say = "ファイルはある。でも、あるだけでは安心できない。大きさを見たいから、見つけたものをそのまま ls に渡す。"
run = "find archive -name '*.tar.gz' -mtime -1 -exec ls -lh {} +"
note = """
`-exec ls -lh {} +` は「見つけたファイルを `{}` の場所に並べて、`ls -lh` を実行する」です。

db のほうが、けた違いに小さくなっています。バックアップは「ある」けれど、中身が入っていません。
"""

[[steps]]
say = "これ、昨夜だけかな。日付の条件を外して、小さすぎるものを全部探してみる。"
run = "find archive -name '*.tar.gz' -size -10k -exec ls -lh {} +"
note = """
`-mtime -1` を `-size -10k`(10 キロバイトより小さい)に取り替えました。

`{{earlier_day}}` の分も小さいままです。昨夜が初めてではなく、前にも同じことが起きていました。
条件を 1 つ取り替えるだけで、別の問いに答えられます。
"""

[[steps]]
say = "ついでに、バックアップ以外のものが紛れていないかも見ておく。「.tar.gz ではないファイル」を探す。"
run = "find archive -type f ! -name '*.tar.gz'"
note = """
`-type f` は「ファイルだけ(ディレクトリは除く)」、`!` は「次の条件に当てはまらないもの」です。

`.part` は、書きかけのまま残されたファイルです。失敗した日と同じ日付のものが残っています。
"""

[[steps]]
say = "ファイルから分かるのはここまで。なぜ失敗したかは、記録に聞く。"
run = "grep -n ERROR logs/backup.log"
note = """
`grep -n` は、見つけた行に行番号を付けます。どちらの日も、データベースへの接続が時間切れになっていました。

探す道具は 2 つあります。**ファイルそのもの**を条件で探すのが `find`、**ファイルの中身**を探すのが `grep` です。
"""
