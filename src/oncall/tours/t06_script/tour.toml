id = "script"
technique = "まとめる"
title = "毎朝の確認を、スクリプトにする"
commands = ["wc", "echo", "bash", "test", "chmod"]
host = "mq-01"
workdir = "jobs"
helps = ["errwatch"]

intro = """
先輩は毎朝、送信待ちの仕事がたまっていないかを確かめています。`spool/` に入っているファイルの数を数えるだけです。

毎朝同じものを打つなら、ファイルに書いておけば済みます。それが**スクリプト**です。
先輩は、いきなりスクリプトを書きません。**まずコマンドラインで動かし、動いたものをファイルに移します**。
"""

outro = """
スクリプトは、特別なものではありません。コマンドラインで打っていたものを、ファイルに並べただけです。

1. コマンドラインで、1 行で動くものを作る
2. ファイルに移して、同じ結果になることを確かめる
3. 変わる部分を引数(`$1`)にする
4. **うまくいかないときに、どう終わるか**を決める

4 つ目が、手で打つときとの違いです。手で打つなら、おかしな結果は目で気づけます。
スクリプトは、人が見ていないところで動きます。だから、失敗を終了コードで伝えます。
"""

[[steps]]
say = "まず、いつも打っているものをそのまま打つ。"
run = "ls spool | wc -l"
note = """
`ls spool` が名前を 1 行に 1 つ出し、`wc -l` がその行数を数えます。送信待ちは {{waiting}} 件です。

スクリプトにするのは、こうして**動くと分かっているもの**です。
"""

[[steps]]
say = "これをファイルに置く。spool のところは、あとで別の場所も数えられるように、$1 にしておくよ。"
run = '''echo 'ls "$1" | wc -l' > qcount.sh'''
note = """
`echo '…' > qcount.sh` で、`ls "$1" | wc -l` という 1 行を `qcount.sh` に書きました。

`$1` は「スクリプトに渡された 1 つ目の引数」です。外側を `'` で囲んだのは、いまこの場で `$1` を解釈させず、
文字のままファイルに書くためです。
"""

[[steps]]
say = "動かしてみる。bash にファイルを渡して、そのあとに数えたい場所を書く。"
run = "bash qcount.sh spool"
note = """
最初に手で打ったときと同じ {{waiting}} 件です。`spool` が `$1` に入り、`ls "spool" | wc -l` が実行されました。

**ファイルに移したら、まず同じ結果になるかを見る**。ここで違っていたら、移し方を間違えています。
"""

[[steps]]
say = "引数にしたおかげで、別の場所も同じスクリプトで数えられる。"
run = "bash qcount.sh sent"
note = """
送信済み(`sent/`)は {{sent}} 件です。スクリプトは書き換えていません。変わったのは引数だけです。

変わる部分を引数にしておくと、1 つのスクリプトが何通りにも使えます。
"""

[[steps]]
say = "ここで寄り道。もし、場所の名前を打ち間違えたらどうなるか。その前に、「あるかどうか」の調べ方を見ておく。"
run = "[ -d nowhere ]; echo $?"
note = """
`[ -d 名前 ]` は「その名前のディレクトリがあるか」を調べます。答えは画面に出ず、**終了コード**で返ります。

`$?` は「直前のコマンドの終了コード」です。0 が「はい(成功)」、0 以外が「いいえ(失敗)」。`nowhere` はないので、1 です。
`[` は記号に見えますが、これも 1 つのコマンドです(`test` と同じ働きをします)。
"""

[[steps]]
say = "じゃあ、いまのスクリプトに、ない場所を渡してみる。"
run = "bash qcount.sh nowhere; echo $?"
note = """
`ls` は「そんな場所はない」と言っています。それなのに、スクリプトは `0` と答え、終了コードも 0(成功)です。

これは困ります。人が見ていれば気づけますが、ほかのプログラムがこの結果だけを見たら、
「送信待ちは 0 件。問題なし」と受け取ってしまいます。
"""

[[steps]]
say = "直す。数える前に、場所があるかを確かめて、なければ失敗で終わるようにする。3 行まとめて書き直すよ。"
run = '''printf '%s\n' '#!/bin/bash' '[ -d "$1" ] || exit 2' 'ls "$1" | wc -l' > qcount.sh'''
note = """
`printf '%s\\n' A B C` は、A・B・C を 1 行ずつ出します。それを `>` でファイルに書きました。

長く見えますが、していることは「3 行のファイルを作る」だけです。中身は、次の手で見ます。
"""

[[steps]]
say = "書いたものは、必ず見る。"
run = "cat qcount.sh"
note = """
1. 1 行目の `#!/bin/bash` は「このファイルは bash で動かす」という印です。
2. 2 行目の `A || B` は「A が失敗したら B をする」です。場所がなければ、`exit 2` で、終了コード 2 を返して終わります。
3. 3 行目は、最初に作った 1 行のままです。

増えたのは、数える前の確かめだけです。
"""

[[steps]]
say = "ついでに、bash と打たなくても動くようにしておく。"
run = "chmod +x qcount.sh"
note = """
`chmod +x` は、ファイルに「実行してよい」という印を付けます。うまくいけば何も出ません。

この印と 1 行目の `#!/bin/bash` がそろうと、`./qcount.sh` と打つだけで動きます。
"""

[[steps]]
say = "もう一度、ない場所を渡す。今度はどう終わるか。"
run = "./qcount.sh nowhere; echo $?"
note = """
今度は `0` と答えず、終了コード 2 で終わりました。「数えられなかった」ことが、結果を見るだけで分かります。

直す前と同じことを試して、結果が変わったのを確かめました。
"""

[[steps]]
say = "最後に、いつもの場所でも確かめる。直したせいで、動いていたものが動かなくなっていないか。"
run = "./qcount.sh spool"
note = """
{{waiting}} 件。最初に手で打ったときと同じです。

うまくいかない場合を直したあとは、**うまくいく場合をもう一度**。直す前と後で、同じ数になることを見ました。
"""
