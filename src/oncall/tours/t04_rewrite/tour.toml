id = "rewrite"
technique = "書き換える"
title = "調査用の設定を、安全に元へ戻す"
commands = ["grep", "sed", "cp", "diff"]
host = "web-02"
workdir = "site"
helps = ["config-fix"]

intro = """
先週の調査のために、いくつかのサービスの記録を詳しくしました(`log_level = debug`)。
調査は終わったのに戻し忘れていて、記録のファイルがどんどん大きくなっています。`info` に戻します。

設定ファイルは `conf/` に {{file_count}} つ。エディタで 1 つずつ開いても直せますが、先輩は `sed` でまとめて直します。
ただし、いきなりは書き換えません。**書き換える前と後に、確かめる手を置きます**。
"""

outro = """
先輩が実際にファイルを書き換えたのは、1 回だけです。ほかは全部、確かめるための手でした。

1. 直したい行を `grep` で見つけ、ほかの行に当たらない書き方を決める
2. `sed` を `-i` なしで動かして、結果を画面で見る
3. 写しを取ってから、`-i` を付けて書き換える
4. `diff` で、変わったのが狙った行だけかを見る

まとめて書き換える道具は、まとめて壊すこともできます。速さは、この確かめ方があって初めて使えます。
"""

[[steps]]
say = "まず、debug がどこに書いてあるかを全部見る。-r は「ディレクトリの中を全部」、-n は行番号。"
run = "grep -rn debug conf"
note = """
直したい `log_level = debug` のほかに、説明の行と `debug_toolbar = off` も見つかりました。

もし「`debug` を `info` に置き換える」と書いたら、この行まで `info_toolbar` に変わってしまいます。
**置き換えの前に、同じ文字がほかにないかを見る**。これが最初の一手です。
"""

[[steps]]
say = "直したい行だけに当たる書き方を探す。行の先頭が log_level のもの、でどうだろう。"
run = "grep -rn '^log_level' conf"
note = """
`^` は「行の先頭」です。`^log_level` は、行が `log_level` で始まるものだけに当たります。説明の行(`#` で始まる)は外れました。

{{file_count}} つのうち、`debug` のままなのは {{debug_count}} つです。
"""

[[steps]]
say = "置き換えを書いてみる。まだファイルは変えない。1 つのファイルで試して、結果を画面で見るだけ。"
run = "sed 's/^log_level = debug/log_level = info/' conf/api.conf"
note = """
`sed 's/A/B/'` は「A を B に置き換える」です。`-i` を付けなければ、結果を画面に出すだけで、ファイルは変わりません。

`log_level` の行は `info` になり、`debug_toolbar` の行はそのままです。狙いどおりです。
"""

[[steps]]
say = "書き換える前に、いまの状態の写しを取っておく。"
run = "cp -r conf conf.bak"
note = """
`cp -r` は、ディレクトリを中身ごと写します。うまくいけば何も出ません。

写しがあれば、失敗しても戻せます。そして、あとで「何が変わったか」を比べる相手にもなります。
"""

[[steps]]
say = "ここで初めて、ファイルを書き換える。さっき試したのと同じ置き換えに -i を付けて、全部のファイルに。"
run = "sed -i 's/^log_level = debug/log_level = info/' conf/*.conf"
note = """
`-i` は「結果を画面に出すかわりに、ファイルを書き換える」です。だから、画面には何も出ません。

何も出ないので、うまくいったのかどうかは、これだけでは分かりません。次の手で確かめます。
"""

[[steps]]
say = "写しと比べる。変わったのが、狙った行だけかどうか。"
run = "diff -r conf.bak conf"
note = """
`diff` は、違う行だけを出します。`<` が前(写し)、`>` が後(いま)です。

変わったのは {{debug_count}} つのファイルの `log_level` の行だけで、ほかの行は 1 つも出ていません。
なお、`diff` は違いが見つかると「失敗」の印で終わりますが、これは「違いがあった」という知らせで、間違いではありません。
"""

[[steps]]
say = "最後にもう一度、最初と同じ grep で見ておく。"
run = "grep -rn '^log_level' conf"
note = """
`debug` はなくなりました。

最初に使った確かめ方を、最後にもう一度使う。前と後を同じ見方で比べられます。
"""
