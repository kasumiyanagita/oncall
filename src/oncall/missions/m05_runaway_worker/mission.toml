id = "runaway-worker"
title = "止まらないワーカー"
level = 3
host = "prod-queue-01"
workdir = "services"
par_time = 480
par_commands = 12
# クリアすると図鑑に登録されるコマンド (commands.toml の名前)
commands = ["ps", "kill", "tail"]

ticket = """
{{incident_id}}   重大度 SEV2   検知 {{detected_at}}
監視システム → オンコール担当(あなた)

prod-queue-01 でエラーログが急増しています。
キューを処理するワーカーのどれかが、同じジョブの失敗とリトライを
繰り返しているようです。

■ 依頼
  暴走しているワーカーのプロセスを特定して止めてください。
  正常に動いているワーカーと、ほかのサービスは止めないでください。

■ 資料
  ~/services/logs/        各プロセスのログ
  ~/services/queue/       各ワーカーが処理中のジョブ
  ~/services/*.sh         各プロセスの起動スクリプト
"""

[[hints]]
text = """
まず、どのワーカーがおかしいのかをログから突き止めましょう。`tail logs/worker-1.log` で末尾の数行が見られます。`tail -f` なら、書き足される様子をそのまま眺められます(Ctrl-C で終了)。

`grep -c ERROR logs/*.log` で、ファイルごとのエラー行数を一度に比べることもできます。
"""

[[hints]]
text = """
動いているプロセスの一覧は `ps -ef` で見られます。`ps -ef | grep queue-worker` とすれば、ワーカーだけに絞れます。

行の右端に起動時のコマンドが出ます。`--id` の番号で、ログで見つけたワーカーがどの行か分かります。左から 2 列目の数字が、そのプロセスの PID です。
"""

[[hints]]
text = """
プロセスを止めるのは `kill PID` です。これは「終了してください」という合図(SIGTERM)を送るだけなので、相手が無視することもあります。止めたあとに `ps` とログの末尾をもう一度確かめましょう。

合図を無視するプロセスは、`kill -9 PID`(SIGKILL)で強制的に終了させられます。
"""

[debrief]
solution = "pkill -9 -f 'queue-worker.sh --id {{stuck_id}}'"

explanation = """
今回暴走していたのは worker-{{stuck_id}} でした。調査から停止までの流れは次のとおりです。

1. `grep -c ERROR logs/*.log`: ログごとのエラー行数を比べ、worker-{{stuck_id}} だけが突出していることを確かめます。
2. `tail -f logs/worker-{{stuck_id}}.log`: 同じジョブのリトライが今も続いていることを確かめます。
3. `ps -ef | grep queue-worker`: 起動時の引数 `--id {{stuck_id}}` から、該当するプロセスの PID を調べます。
4. `kill PID`: まず通常の終了の合図(SIGTERM)を送ります。今回のワーカーはこれを無視し、その旨をログに書いていました。
5. `kill -9 PID`: 無視できない SIGKILL で強制的に終了させます。

**最初から `kill -9` を使わないのには理由があります。**SIGTERM を受けたプロセスは、書きかけのファイルを閉じる、処理中のジョブを戻すといった後始末をしてから終了できます。SIGKILL はその機会を与えずに止めるので、まず SIGTERM を試し、効かないときだけ SIGKILL を使うのが作法です。

上の模範解答の `pkill -f` は、起動時のコマンド全体をパターンで探して合図を送るコマンドで、`ps` と `kill` の 2 手を 1 つにまとめられます。パターンが広すぎると関係のないプロセスまで止めてしまうので、先に `pgrep -af パターン` で何に一致するか確かめてから使います(簡易モードでは `pkill` は使えないので、`ps` で調べた PID を `kill` に渡します)。
"""

[[debrief.alternatives]]
command = "kill -9 $(pgrep -f 'queue-worker.sh --id {{stuck_id}}')"
note = "`pgrep` は一致したプロセスの PID を出力します。`$( )` でその結果を `kill` の引数に埋め込んでいます。"
