id = "disk-and-keys"
title = "満杯のディスクと開いた鍵"
level = 2
host = "prod-batch-02"
workdir = "srv"
par_time = 540
par_commands = 14
# クリアすると図鑑に登録されるコマンド (commands.toml の名前)
commands = ["find", "du", "chmod"]

ticket = """
{{incident_id}}   重大度 SEV3   検知 {{detected_at}}
監視システム → オンコール担当(あなた)

prod-batch-02 のディスク使用率が 95% を超えました。
調査の途中で、秘密鍵の権限に不備があることも見つかっています。

■ 依頼 1  ディスクを空ける
  ~/srv 以下で「10MB を超え、かつ 7 日より前から更新されていない」
  ファイルをすべて削除してください。
  新しいファイルや小さいファイルは稼働中のサービスが使っています。
  消さないでください。

■ 依頼 2  秘密鍵を守る
  ~/srv 以下の秘密鍵 (*.pem) を、すべて所有者だけが読み書きできる
  権限 (600) にしてください。
  それ以外のファイルやディレクトリの権限は変えないでください。
"""

[[hints]]
text = """
まず `du -sh *` で、どのディレクトリが容量を使っているか当たりを付けましょう。

ファイルを条件で探すのは `find` の仕事です。`find . -type f -size +10M` で、10MB を超えるファイルの一覧が出ます。`ls -lh` で大きさと更新日を確かめられます。
"""

[[hints]]
text = """
`find` は条件を並べて書くと「すべて満たすもの」だけに絞り込みます。更新日の条件は `-mtime +7`(7 日より前)です。

`find . -type f -size +10M -mtime +7`

いきなり消さず、まず一覧を見て確かめてから、末尾に `-delete` を付けて実行します。
"""

[[hints]]
text = """
鍵は名前で探せます。`find . -name '*.pem' -exec ls -l {} +` で、いまの権限を一覧できます。

`-exec コマンド {} +` は、見つかったファイルをまとめてコマンドに渡す書き方です。`ls -l` を `chmod 600` に替えれば、権限をまとめて直せます。
"""

[debrief]
solution = '''
find . -type f -size +10M -mtime +7 -delete
find . -name '*.pem' -exec chmod 600 {} +
'''

explanation = """
**依頼 1** は、2 つの条件を両方満たすファイルだけを消す作業でした。

1. `-type f`: 通常のファイルだけを対象にします(ディレクトリを除く)。
2. `-size +10M`: 10MB を超えるもの。`+` は「より大きい」、`-` なら「より小さい」です。
3. `-mtime +7`: 最後の更新が 7 日より前のもの。
4. `-delete`: 条件に合ったものを削除します。

このディレクトリには、大きいけれど今も書き込まれているデータベースや、古いけれど小さいログが混ざっていました。条件を 1 つしか見ないと、稼働中のファイルまで消してしまいます。**`-delete` を付ける前に、同じ条件で一覧を出して目で確かめる**のが、本番で事故を起こさないための習慣です。

**依頼 2** の `chmod 600` は「所有者は読み書き可、ほかの人は何もできない」という権限です。3 桁の数字は左から所有者・グループ・その他で、読み 4、書き 2、実行 1 の合計で表します。`chmod -R 600 .` のようにまとめて変えると、ディレクトリに入れなくなったり、スクリプトが実行できなくなったりします。対象を名前で絞って渡すのが安全です。
"""

[[debrief.alternatives]]
partial = true
command = "find . -type f -size +10M -mtime +7 -exec rm -v {} +"
note = "`-delete` の代わりに `rm` を呼ぶ形です。`-v` を付けると、消したファイルの名前が表示されて記録に残せます。"

[[debrief.alternatives]]
partial = true
command = "find . -name '*.pem' ! -perm 600 -exec chmod 600 {} +"
note = "`! -perm 600` で「権限が 600 ではないもの」だけに絞れます。`-exec` を外して実行すれば、問題のある鍵だけを一覧できます。"
